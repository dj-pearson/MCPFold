# kong.yml (S6.1) — declarative API-gateway routes for the self-hosted stack. Fronts
# GoTrue (auth), PostgREST (rest), and Realtime under one origin so the web app and CLI
# talk to a single URL. Referenced by docker-compose.coolify.yml. No secrets here.
_format_version: '2.1'

services:
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth
        strip_path: true
        paths: ['/auth/v1']
    plugins:
      - name: cors

  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest
        strip_path: true
        paths: ['/rest/v1']
    plugins:
      - name: cors

  - name: realtime
    url: http://realtime:4000/socket/
    routes:
      - name: realtime
        strip_path: true
        paths: ['/realtime/v1']
    plugins:
      - name: cors

  # Side edge service (S6.5) — the mcpfold sync/auth API. Kong path-splits api.mcpfold.com so the
  # CLI + web app reach a single origin: Supabase paths above go to Kong's backends, while these
  # prefixes proxy to the `edge` container (same compose network). strip_path is FALSE — the edge
  # matches the full path (e.g. /auth-device/start), so Kong must forward it verbatim.
  - name: edge
    url: http://edge:8000/
    routes:
      - name: edge
        strip_path: false
        paths: ['/auth-device', '/push', '/pull', '/teams', '/status']
    plugins:
      - name: cors
