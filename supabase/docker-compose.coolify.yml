# docker-compose.coolify.yml (S6.1) — self-hosted Supabase for the Contabo VPS via Coolify.
# Stands up the four services the sync API needs: Postgres, GoTrue (auth), PostgREST
# (rest), and Realtime, behind a Kong gateway. This is the DEPLOYMENT artifact — it is NOT
# run in CI (CI uses docker-compose.ci.yml). Deploy it in Coolify as a Docker Compose
# resource; see docs/self-hosting.md.
#
# SECRETS: every value below comes from the environment (Coolify env / Infisical). Nothing
# secret is committed. Copy .env.example → set real values in Coolify, never in git.
# Image tags: pin to the current set from github.com/supabase/supabase/tree/master/docker
# when you deploy; the tags here are a known-good baseline.

services:
  db:
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.132.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?e.g. https://api.mcpfold.com}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-https://mcpfold.com}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-https://mcpfold.com/auth/callback}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_OAUTH_SECRET:-}

  rest:
    image: postgrest/postgrest:v12.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'

  realtime:
    image: supabase/realtime:v2.25.50
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_ENC_KEY: ${REALTIME_ENC_KEY:?set REALTIME_ENC_KEY (32 chars)}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:?set REALTIME_SECRET_KEY_BASE (64 chars)}
      ERL_AFLAGS: -proto_dist inet_tcp

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - realtime
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth
    ports:
      # Coolify terminates TLS in front of this; expose only the gateway.
      - '8000:8000'
    volumes:
      - ./kong.yml:/home/kong/kong.yml:ro

  # Side edge service (S6.5) — the standalone Deno container serving the auth-device / push / pull /
  # teams / status handlers. Co-located in this stack so it shares the internal network with `db`
  # (reaches Postgres directly as db:5432) and inherits the SAME JWT_SECRET — that's what makes its
  # HS256 access tokens interoperate with GoTrue/PostgREST + the S6.2 RLS policies. Nothing secret
  # is committed; all values come from Coolify env / Infisical, same as the services above.
  #
  # Routing: point api.mcpfold.com/{auth-device,push,pull,teams,status} at this service's :8000 in
  # Coolify (Traefik), while every other api path keeps hitting Kong (deployment.md §3). It is
  # `expose`d (not host-published) to avoid colliding with Kong on :8000; the proxy routes to it by
  # container name on the internal network.
  edge:
    build:
      context: ../services/edge
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SITE_URL: ${SITE_URL:-https://mcpfold.com}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
    expose:
      - '8000'

volumes:
  db-data:
