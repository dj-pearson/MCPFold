name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prove every publishable package is publish-ready on each PR/push, without publishing:
  # publint validates package.json + entry points, then a recursive dry-run publish.
  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Version parity across install channels (npm/homebrew/scoop)
        run: pnpm check:version-parity
      - name: publint (publish-readiness lint)
        run: pnpm --filter "./packages/*" exec publint
      - name: Dry-run publish (no registry writes)
        run: pnpm -r publish --dry-run --no-git-checks
      # Post-install smoke (S8.4): pack every publishable package, install the tarballs into a
      # clean project, and run the published `mcpfold` binary through init → doctor → sync. This
      # catches a broken bin path / missing `files` entry / bad dep version before it hits npm.
      - name: Post-install smoke test
        run: node scripts/pack-smoke.mjs

  # Publish on merge to main: Changesets opens/updates a "Version Packages" PR, and when that
  # PR merges (bumped versions, no pending changesets) it publishes to npm with provenance.
  release:
    name: changesets release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          # Publish to npm only; don't spawn a GitHub Release per package. A single product
          # release (tag `v*`) is cut separately and carries the standalone binaries.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  # Standalone binaries (S11.1): on a published GitHub Release, build a native binary for every
  # OS/arch using native runners (cross-compilation from Linux fails for macOS arm64 targets).
  binaries:
    name: standalone binaries (${{ matrix.platform }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            targets: node20-linux-x64,node20-linux-arm64
          - platform: macos
            os: macos-latest
            targets: node20-macos-arm64,node20-macos-x64
          - platform: windows
            os: windows-latest
            targets: node20-win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build standalone binaries + checksums
        run: pnpm build:binaries -- ${{ matrix.targets }}
      - name: Attach binaries to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/mcpfold-*-*
            build/mcpfold-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # NEEDS (user, one-time): a HOMEBREW_TAP_TOKEN + a dj-pearson/homebrew-tap repo and a
      # dj-pearson/scoop-bucket repo, then a step here to bump + push packaging/homebrew/mcpfold.rb
      # and packaging/scoop/mcpfold.json (version + sha256) to them so `brew`/`scoop` auto-update.
