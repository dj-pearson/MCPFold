name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prove every publishable package is publish-ready on each PR/push, without publishing:
  # publint validates package.json + entry points, then a recursive dry-run publish.
  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Version parity across install channels (npm/homebrew/scoop)
        run: pnpm check:version-parity
      - name: publint (publish-readiness lint)
        run: pnpm --filter "./packages/*" exec publint
      - name: Dry-run publish (no registry writes)
        run: pnpm -r publish --dry-run --no-git-checks
      # Post-install smoke (S8.4): pack every publishable package, install the tarballs into a
      # clean project, and run the published `mcpfold` binary through init → doctor → sync. This
      # catches a broken bin path / missing `files` entry / bad dep version before it hits npm.
      - name: Post-install smoke test
        run: node scripts/pack-smoke.mjs

  # Publish on merge to main: Changesets opens/updates a "Version Packages" PR, and when that
  # PR merges (bumped versions, no pending changesets) it publishes to npm with provenance.
  # When it publishes, `published`/`version` outputs fan the binaries + GitHub Release +
  # Homebrew/Scoop jobs out IN THIS SAME RUN — so one merge of the Version Packages PR ships
  # every channel. (We can't lean on the `release: published` event for that cascade: a Release
  # created with the default GITHUB_TOKEN does NOT emit events, so downstream jobs would never fire.)
  release:
    name: changesets release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC: publishes via npm Trusted Publishers (no token) + provenance
    outputs:
      # 'true' only when changeset publish actually pushed packages (i.e. the Version Packages PR
      # merged); 'false' when this push merely opened/updated that PR. Gates the cascade below.
      published: ${{ steps.changesets.outputs.published }}
      # The product version just published (from the mcpfold CLI package). Fixed-group versioning
      # keeps all packages in lockstep, so this is the single version to tag as `v<version>`.
      version: ${{ steps.product-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # No registry-url on purpose: it writes an .npmrc with a token authToken, which makes npm
          # use token auth and skip OIDC. Publishing goes through npm Trusted Publishers (OIDC).
      # npm OIDC Trusted Publishing requires npm >= 11.5.1. Node 20 bundles npm 10.x, which can't
      # perform the OIDC token exchange and fails with ENEEDAUTH even when trusted publishers are
      # configured. `changeset publish` shells out to this global npm, so upgrade it here.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm i -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Runs the `version-packages` script (a shell script, so the && chain works): bump packages,
          # embed the CLI version, and sync the Homebrew/Scoop template versions — so `--version` is
          # correct and the version-parity gate stays green. All of it lands in the "Version Packages" PR.
          version: pnpm run version-packages
          publish: pnpm changeset publish
          # Publish to npm only; don't spawn a GitHub Release per package. The single product
          # release (tag `v*`) that carries the standalone binaries is created downstream in
          # publish-assets, gated on this job's `published` output.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing uses OIDC Trusted Publishers (configured per package on npmjs.com for this
          # repo + workflow) — no NPM_TOKEN. REQUIRES every published package (mcpfold and all five
          # @mcpfold/* packages) to have a trusted publisher set, or its publish will 403.
          NPM_CONFIG_PROVENANCE: 'true'
      # Read the just-published version off disk (the merged Version Packages PR already bumped it).
      # Only meaningful when a publish happened; downstream jobs gate on `published` anyway.
      - name: Resolve product version
        id: product-version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

  # Standalone binaries (S11.1): build a native binary for every OS/arch using native runners
  # (cross-compilation from Linux fails for macOS arm64 targets). Runs when a release is published
  # manually, on manual dispatch (build-only smoke), or automatically right after `release` publishes
  # to npm. `always()` lets the `if` evaluate even though `release` is skipped on the release/dispatch
  # paths; the push path additionally requires `release` to have succeeded and actually published.
  binaries:
    name: standalone binaries (${{ matrix.platform }})
    needs: release
    if: >-
      always() && (
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.published == 'true')
      )
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            targets: node22-linux-x64,node22-linux-arm64
          - platform: macos
            os: macos-latest
            targets: node22-macos-arm64,node22-macos-x64
          - platform: windows
            os: windows-latest
            targets: node22-win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          # pkg fetches a base binary matching the runner's exact Node version from its pkg-fetch
          # release (v3.6). Pin to 22.23.1 — a version v3.6 ships prebuilts for on every OS/arch —
          # so no from-source build, and Node 22 supports require(ESM) (pkg's into-stream dep).
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build standalone binaries + checksums
        run: pnpm build:binaries -- ${{ matrix.targets }}
      # Upload as artifacts; a single downstream job attaches them all to the release. Attaching
      # directly from three parallel matrix jobs races on the same release (404 on asset update).
      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: build/mcpfold-*
          if-no-files-found: error
          retention-days: 1

  # Single job (no matrix) that creates/attaches the product GitHub Release once and publishes the
  # Homebrew formula + Scoop manifest. Doing the attach here — not in the parallel matrix jobs —
  # avoids the concurrent-asset-update race. Runs on a manually published Release, or automatically
  # right after `release` publishes to npm (the push path), in which case softprops CREATES the
  # `v<version>` Release at this commit. NOT on workflow_dispatch (that stays a build-only smoke).
  # Homebrew/Scoop push needs a one-time HOMEBREW_TAP_TOKEN (PAT with write access to
  # dj-pearson/homebrew-tap + scoop-bucket); without it the manifests are rendered but the push is
  # skipped (the release still succeeds).
  publish-assets:
    name: attach binaries + publish homebrew/scoop
    needs: [release, binaries]
    if: >-
      always() && needs.binaries.result == 'success' && (
        github.event_name == 'release' ||
        (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.published == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On a manual Release the tag is the event's tag; on the automatic push path there is no
      # Release yet, so we derive `v<version>` from the release job and let softprops create it.
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v${{ needs.release.outputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          pattern: binaries-*
          merge-multiple: true
      - name: Create/attach the release (once, no race)
        uses: softprops/action-gh-release@v2
        with:
          # On the push path this tag doesn't exist yet: softprops creates the tag + Release at the
          # checked-out commit (main HEAD, which carries the version bump). On the manual path it
          # updates the existing Release. generate_release_notes only fills notes at creation time,
          # so it won't clobber a human-authored body on the manual path.
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            build/mcpfold-*-*
            build/mcpfold-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render Homebrew formula + Scoop manifest
        run: node scripts/render-packaging.mjs "$TAG"
      - name: Push to homebrew-tap + scoop-bucket
        if: env.TAP_TOKEN != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dj-pearson/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist-packaging/mcpfold.rb tap/Formula/mcpfold.rb
          git -C tap add Formula/mcpfold.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "mcpfold $TAG"
          git -C tap push

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dj-pearson/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp dist-packaging/mcpfold.json bucket/bucket/mcpfold.json
          git -C bucket add bucket/mcpfold.json
          git -C bucket diff --cached --quiet || git -C bucket commit -m "mcpfold $TAG"
          git -C bucket push
      - name: Note when skipped
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN not set — rendered manifests but skipped the tap/bucket push."
