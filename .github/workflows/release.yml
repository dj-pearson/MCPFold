name: Release

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prove every publishable package is publish-ready on each PR/push, without publishing:
  # publint validates package.json + entry points, then a recursive dry-run publish.
  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: publint (publish-readiness lint)
        run: pnpm --filter "./packages/*" exec publint
      - name: Dry-run publish (no registry writes)
        run: pnpm -r publish --dry-run --no-git-checks
      # Post-install smoke (S8.4): pack every publishable package, install the tarballs into a
      # clean project, and run the published `mcpfold` binary through init → doctor → sync. This
      # catches a broken bin path / missing `files` entry / bad dep version before it hits npm.
      - name: Post-install smoke test
        run: node scripts/pack-smoke.mjs

  # Publish on merge to main: Changesets opens/updates a "Version Packages" PR, and when that
  # PR merges (bumped versions, no pending changesets) it publishes to npm with provenance.
  release:
    name: changesets release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
