name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prove every publishable package is publish-ready on each PR/push, without publishing:
  # publint validates package.json + entry points, then a recursive dry-run publish.
  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Version parity across install channels (npm/homebrew/scoop)
        run: pnpm check:version-parity
      - name: publint (publish-readiness lint)
        run: pnpm --filter "./packages/*" exec publint
      - name: Dry-run publish (no registry writes)
        run: pnpm -r publish --dry-run --no-git-checks
      # Post-install smoke (S8.4): pack every publishable package, install the tarballs into a
      # clean project, and run the published `mcpfold` binary through init → doctor → sync. This
      # catches a broken bin path / missing `files` entry / bad dep version before it hits npm.
      - name: Post-install smoke test
        run: node scripts/pack-smoke.mjs

  # Publish on merge to main: Changesets opens/updates a "Version Packages" PR, and when that
  # PR merges (bumped versions, no pending changesets) it publishes to npm with provenance.
  release:
    name: changesets release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          # Bump packages, then sync the Homebrew/Scoop template versions so the version-parity gate
          # stays green (the "Version Packages" PR carries the bump).
          version: pnpm changeset version && node scripts/sync-packaging-version.mjs
          publish: pnpm changeset publish
          # Publish to npm only; don't spawn a GitHub Release per package. A single product
          # release (tag `v*`) is cut separately and carries the standalone binaries.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  # Standalone binaries (S11.1): on a published GitHub Release, build a native binary for every
  # OS/arch using native runners (cross-compilation from Linux fails for macOS arm64 targets).
  binaries:
    name: standalone binaries (${{ matrix.platform }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            targets: node22-linux-x64,node22-linux-arm64
          - platform: macos
            os: macos-latest
            targets: node22-macos-arm64,node22-macos-x64
          - platform: windows
            os: windows-latest
            targets: node22-win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          # pkg fetches a base binary matching the runner's exact Node version from its pkg-fetch
          # release (v3.6). Pin to 22.23.1 — a version v3.6 ships prebuilts for on every OS/arch —
          # so no from-source build, and Node 22 supports require(ESM) (pkg's into-stream dep).
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build standalone binaries + checksums
        run: pnpm build:binaries -- ${{ matrix.targets }}
      # Upload as artifacts; a single downstream job attaches them all to the release. Attaching
      # directly from three parallel matrix jobs races on the same release (404 on asset update).
      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: build/mcpfold-*
          if-no-files-found: error
          retention-days: 1

  # Single job (no matrix) that collects all built binaries, attaches them to the release once, and
  # publishes the Homebrew formula + Scoop manifest. Doing the attach here — not in the parallel
  # matrix jobs — avoids the concurrent-asset-update race. Homebrew/Scoop push needs a one-time
  # HOMEBREW_TAP_TOKEN (PAT with write access to dj-pearson/homebrew-tap + scoop-bucket); without it
  # the manifests are rendered but the push is skipped (the release still succeeds).
  publish-assets:
    name: attach binaries + publish homebrew/scoop
    if: github.event_name == 'release'
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          pattern: binaries-*
          merge-multiple: true
      - name: Attach binaries to the release (once, no race)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            build/mcpfold-*-*
            build/mcpfold-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render Homebrew formula + Scoop manifest
        run: node scripts/render-packaging.mjs "$TAG"
      - name: Push to homebrew-tap + scoop-bucket
        if: env.TAP_TOKEN != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dj-pearson/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist-packaging/mcpfold.rb tap/Formula/mcpfold.rb
          git -C tap add Formula/mcpfold.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "mcpfold $TAG"
          git -C tap push

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dj-pearson/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp dist-packaging/mcpfold.json bucket/bucket/mcpfold.json
          git -C bucket add bucket/mcpfold.json
          git -C bucket diff --cached --quiet || git -C bucket commit -m "mcpfold $TAG"
          git -C bucket push
      - name: Note when skipped
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN not set — rendered manifests but skipped the tap/bucket push."
