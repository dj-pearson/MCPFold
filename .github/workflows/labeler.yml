name: Labeler

# Auto-labels PRs by the area they touch, using .github/labeler.yml.
# Runs on pull_request_target so it works for fork PRs too — it only reads the
# changed-file list and applies labels, never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
