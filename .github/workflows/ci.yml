name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-OS matrix — path resolution is central to this product, so the
  # Windows/macOS/Linux matrix is non-negotiable. Any lint/type/test/build
  # failure fails the build.
  verify:
    name: verify (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm -r test --coverage

      - name: Build
        run: pnpm -r build

  # Dedicated core-purity gate: packages/core must never import node:fs / node:os /
  # node:path / net / http or any process/network lib. Runs the static check
  # independently of the lint job so a lint-config regression can't hide a breach.
  core-purity:
    name: core purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert core purity
        run: node scripts/check-core-purity.mjs

      - name: Assert formatting
        run: pnpm format:check
