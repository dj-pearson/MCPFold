name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-OS matrix — path resolution is central to this product, so the
  # Windows/macOS/Linux matrix is non-negotiable. Any lint/type/test/build
  # failure fails the build.
  verify:
    name: verify (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm -r test --coverage

      - name: Build
        run: pnpm -r build

  # Dedicated core-purity gate: packages/core must never import node:fs / node:os /
  # node:path / net / http or any process/network lib. Runs the static check
  # independently of the lint job so a lint-config regression can't hide a breach.
  core-purity:
    name: core purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert core purity
        run: node scripts/check-core-purity.mjs

      - name: Assert formatting
        run: pnpm format:check

  # Docs build gate (S8.1): render the docs site and fail on any broken internal link,
  # missing required page, or invalid hosted schema. The Pages deploy (docs.yml) reuses
  # the same build, so a green docs job means the site is publishable.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs (link-check + schema staging)
        run: pnpm docs:build

      # Terminal demo (S11.4): rebuild the CLI, regenerate the recording from the real CLI, and
      # fail if the committed cast/SVG drifted — so the demo can never lie about actual output.
      - name: Build workspace (for demo recorder)
        run: pnpm -r build
      - name: Demo is up to date (no drift from real CLI)
        run: |
          pnpm demo:record
          git diff --exit-code demo/mcpfold.cast docs/assets/demo.svg

  # Database integration gate (S6.1): stand up the CI Supabase database from the same
  # compose developers use, apply the migrations with the psql runner, and smoke-test the
  # result (which also asserts the runner is idempotent). A broken migration fails here
  # before it can reach the Coolify deployment.
  db:
    name: db integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Supabase database
        run: docker compose -f supabase/docker-compose.ci.yml up -d --wait

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
        run: bash supabase/scripts/migrate.sh

      - name: Smoke test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
        run: bash supabase/scripts/smoke-test.sh

      - name: RLS + immutability + reference-only tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
        run: bash supabase/scripts/test-rls.sh

      # Edge functions are Deno (services/edge), outside the pnpm workspace. Their unit tests
      # (crypto/JWT) plus the device-code auth integration test (S6.3) run against the same
      # live database the migrations were applied to.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge function tests (device-code auth)
        working-directory: services/edge
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long-000
        run: deno test --allow-net --allow-env

      # Encrypted-backup encrypt→restore round-trip (S9.4). Runs the pg client inside the DB
      # container so pg_dump matches the server version.
      - name: Encrypted backup round-trip
        run: |
          CID=$(docker compose -f supabase/docker-compose.ci.yml ps -q db)
          MCPFOLD_PG_CONTAINER="$CID" bash supabase/backup/test-backup.sh

      - name: Tear down
        if: always()
        run: docker compose -f supabase/docker-compose.ci.yml down -v

  # Side edge service container (S6.5): build the Deno image, stand it up with Postgres via
  # docker-compose, and prove the JWT/RLS contract over HTTP (health + unauth-rejected +
  # authenticated push/pull round-trip) before it can ship.
  edge-container:
    name: edge container (side service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Container smoke (build + health + auth push/pull)
        run: bash services/edge/scripts/container-smoke.sh

  # Web console e2e (S7.1): Playwright drives the login flow + gated-route redirect against a Vite
  # dev server with mock auth (VITE_E2E=1) — no live Supabase needed.
  web-e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The dev server imports @mcpfold/core, so build it first.
      - name: Build core
        run: pnpm --filter @mcpfold/core build

      - name: Install Playwright browser
        run: pnpm --filter @mcpfold/web exec playwright install --with-deps chromium

      - name: Run web e2e
        run: pnpm --filter @mcpfold/web e2e
