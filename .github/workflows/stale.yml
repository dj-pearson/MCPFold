name: Stale

# Nudges and eventually closes issues/PRs that have gone quiet, so the tracker
# reflects live work. Conservative timings; security and pinned items are exempt.
on:
  schedule:
    - cron: '30 1 * * *' # daily at 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,roadmap,good first issue'
          exempt-pr-labels: 'pinned,security,dependencies'
          exempt-all-milestones: true
          stale-issue-message: >
            This issue has been quiet for 60 days and is now marked stale. Comment
            to keep it open, otherwise it will close in 14 days. Not a judgment on
            validity — just keeping the tracker current.
          stale-pr-message: >
            This pull request has been quiet for 60 days and is now marked stale.
            Push an update or comment to keep it open, otherwise it will close in
            14 days. Feel free to reopen when you're ready to pick it back up.
          close-issue-message: >
            Closing as stale after no activity. Comment to reopen — we're happy to
            revisit.
          close-pr-message: >
            Closing as stale after no activity. Reopen anytime to continue.
