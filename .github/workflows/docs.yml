name: Deploy docs

# Publishes the docs site (and the hosted JSON schema at /schema/v1.json) to GitHub Pages
# on every push to main. The same build runs as a gate in ci.yml, so main only deploys
# what already passed link-checking.
#
# One-time setup (repo admin): Settings → Pages → Source = "GitHub Actions". A custom
# domain (mcpfold.com) is baked in via the CNAME file the build emits; point the DNS at
# GitHub Pages to serve the schema at https://mcpfold.com/schema/v1.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let the current publish finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-docs

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # Gated until GitHub Pages is set up (like the Cloudflare deploys). To publish the docs site:
    #   1. Settings → Pages → Source = "GitHub Actions"
    #   2. Settings → Secrets and variables → Actions → Variables → add PAGES_ENABLED = true
    # Until then the deploy is SKIPPED (not failed), so `main` stays green. The `build` job above
    # still runs on every push, so a broken docs build is caught regardless.
    if: vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
