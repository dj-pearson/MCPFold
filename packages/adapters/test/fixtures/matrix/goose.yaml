extensions:
  github:
    type: streamable_http
    name: github
    uri: https://api.githubcopilot.com/mcp/
    headers: {}
    enabled: true
    bundled: false
    timeout: 300
  playwright:
    type: stdio
    name: playwright
    cmd: npx
    args:
      - -y
      - "@playwright/mcp@latest"
    envs:
      HEADLESS: "true"
    enabled: true
    bundled: false
    timeout: 300
